<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de entrega CI/CD</title>
  <desc id="desc">Flujo obligatorio desde issue y requisito hasta tests, commit, push y CI en GitHub.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344b42"/></marker><style>text{font-family:Arial,sans-serif;fill:#29333d}.title{font-size:28px;font-weight:700}.label{font-size:16px;font-weight:700}.note{font-size:13px}.box{fill:#eef5df;stroke:#7ca34b;stroke-width:2}.gate{fill:#fff2dd;stroke:#d18f4d;stroke-width:2}.line{stroke:#344b42;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="650" fill="#f5f7f4"/><text x="60" y="58" class="title">Entrega CI/CD</text><text x="60" y="84" class="note">Skill: .agents/skills/cicd-github-delivery.md</text>
  <rect x="60" y="190" width="180" height="110" rx="16" class="box"/><text x="150" y="230" text-anchor="middle" class="label">Issue GitHub</text><text x="150" y="256" text-anchor="middle" class="note">problema + decision</text><text x="150" y="278" text-anchor="middle" class="note">REQ + acceptance</text>
  <rect x="300" y="190" width="180" height="110" rx="16" class="box"/><text x="390" y="230" text-anchor="middle" class="label">Implementar</text><text x="390" y="256" text-anchor="middle" class="note">codigo + docs</text><text x="390" y="278" text-anchor="middle" class="note">Issue local</text>
  <rect x="540" y="160" width="180" height="170" rx="16" class="gate"/><text x="630" y="202" text-anchor="middle" class="label">Validar</text><text x="630" y="230" text-anchor="middle" class="note">npm run lint</text><text x="630" y="252" text-anchor="middle" class="note">npm run build</text><text x="630" y="280" text-anchor="middle" class="note">si falla: reparar</text>
  <rect x="780" y="190" width="180" height="110" rx="16" class="box"/><text x="870" y="230" text-anchor="middle" class="label">Commit</text><text x="870" y="256" text-anchor="middle" class="note">Conventional Commit</text><text x="870" y="278" text-anchor="middle" class="note">issue + REQ</text>
  <rect x="1020" y="190" width="120" height="110" rx="16" class="box"/><text x="1080" y="230" text-anchor="middle" class="label">Push</text><text x="1080" y="256" text-anchor="middle" class="note">main</text><text x="1080" y="278" text-anchor="middle" class="note">no force</text>
  <path d="M240 245H300" class="line"/><path d="M480 245H540" class="line"/><path d="M720 245H780" class="line"/><path d="M960 245H1020" class="line"/>
  <rect x="420" y="450" width="180" height="100" rx="16" class="gate"/><text x="510" y="490" text-anchor="middle" class="label">CI GitHub</text><text x="510" y="516" text-anchor="middle" class="note">lint + build</text>
  <rect x="700" y="450" width="180" height="100" rx="16" class="box"/><text x="790" y="490" text-anchor="middle" class="label">Cerrar issue</text><text x="790" y="516" text-anchor="middle" class="note">Closes #N</text>
  <path d="M1080 300V400H510V450" class="line"/><path d="M600 500H700" class="line"/>
  <text x="60" y="600" class="note">La issue queda abierta si falta autenticacion, push o CI verde.</text>
</svg>
