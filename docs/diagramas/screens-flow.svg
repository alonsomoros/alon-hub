<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Flujo de pantallas de alXns Central Hub</title><desc id="desc">Navegacion desde splash hacia Inicio, Retos y Enlaces, con acciones de cada vista.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344b42"/></marker><style>text{font-family:Arial,sans-serif;fill:#29333d}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.note{font-size:13px}.screen{fill:#eef5df;stroke:#7ca34b;stroke-width:2}.action{fill:#fff;stroke:#dfe9df;stroke-width:2}.line{stroke:#344b42;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="680" fill="#f5f7f4"/><text x="60" y="58" class="title">Flujo de pantallas</text><text x="60" y="84" class="note">Navegacion implementada en Dashboard.activeView</text><rect x="70" y="250" width="170" height="100" rx="16" class="screen"/><text x="155" y="290" text-anchor="middle" class="label">Splash</text><text x="155" y="316" text-anchor="middle" class="note">700 ms</text><path d="M240 300H325" class="line"/><rect x="325" y="190" width="220" height="220" rx="16" class="screen"/><text x="435" y="235" text-anchor="middle" class="label">Inicio</text><text x="435" y="266" text-anchor="middle" class="note">cita + Raspberry Pi</text><text x="435" y="289" text-anchor="middle" class="note">servicios + accesos</text><text x="435" y="312" text-anchor="middle" class="note">links.slice(0, 3)</text><path d="M545 235H650" class="line"/><path d="M545 365H650" class="line"/><rect x="650" y="150" width="220" height="140" rx="16" class="screen"/><text x="760" y="194" text-anchor="middle" class="label">Retos</text><text x="760" y="222" text-anchor="middle" class="note">progreso visual</text><text x="760" y="245" text-anchor="middle" class="note">volver a Inicio</text><rect x="650" y="330" width="220" height="180" rx="16" class="screen"/><text x="760" y="372" text-anchor="middle" class="label">Enlaces</text><text x="760" y="400" text-anchor="middle" class="note">anadir / borrar / abrir</text><text x="760" y="423" text-anchor="middle" class="note">drag and drop nativo</text><text x="760" y="446" text-anchor="middle" class="note">estado en memoria</text><rect x="950" y="150" width="180" height="80" rx="14" class="action"/><text x="1040" y="184" text-anchor="middle" class="label">Nuevo reto</text><text x="1040" y="207" text-anchor="middle" class="note">pendiente</text><rect x="950" y="330" width="180" height="80" rx="14" class="action"/><text x="1040" y="364" text-anchor="middle" class="label">Anadir enlace</text><text x="1040" y="387" text-anchor="middle" class="note">formulario local</text><path d="M870 220H950" class="line"/><path d="M870 370H950" class="line"/><path d="M760 290V330" class="line"/><path d="M650 220H590V470H435V410" class="line"/><path d="M650 400H590V470H435V410" class="line"/><text x="70" y="590" class="note">Las acciones de persistencia y edicion de retos siguen pendientes.</text></svg>
