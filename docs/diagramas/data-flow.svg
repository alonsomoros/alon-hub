<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de datos de alXns Central Hub</title>
  <desc id="desc">Datos estaticos y estado React alimentan la interfaz; la cita usa una API externa con fallback y el resto de integraciones estan preparadas.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344b42"/></marker><style>text{font-family:Arial,sans-serif;fill:#29333d}.title{font-size:28px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:13px}.live{fill:#eef5df;stroke:#7ca34b;stroke-width:2}.ready{fill:#fff2dd;stroke:#d18f4d;stroke-width:2}.planned{fill:#f8e9e5;stroke:#cf897a;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#344b42;stroke-width:2;fill:none;marker-end:url(#arrow)}.future{stroke:#cf897a;stroke-dasharray:8 6}</style></defs>
  <rect width="1200" height="700" fill="#f5f7f4"/><text x="60" y="58" class="title">Flujo de datos</text><text x="60" y="84" class="note">Estado actual y limites de integracion</text>
  <rect x="60" y="170" width="190" height="130" rx="16" class="live"/><text x="155" y="212" text-anchor="middle" class="label">Datos iniciales</text><text x="155" y="240" text-anchor="middle" class="note">services</text><text x="155" y="262" text-anchor="middle" class="note">defaultLinks</text><text x="155" y="284" text-anchor="middle" class="note">fallbackQuote</text>
  <rect x="340" y="140" width="220" height="190" rx="16" class="live"/><text x="450" y="182" text-anchor="middle" class="label">React state</text><text x="450" y="212" text-anchor="middle" class="note">quote</text><text x="450" y="234" text-anchor="middle" class="note">activeView</text><text x="450" y="256" text-anchor="middle" class="note">links / newLink</text><text x="450" y="286" text-anchor="middle" class="note">add / delete / reorder</text>
  <rect x="650" y="140" width="220" height="190" rx="16" class="live"/><text x="760" y="182" text-anchor="middle" class="label">UI output</text><text x="760" y="212" text-anchor="middle" class="note">HomeView</text><text x="760" y="234" text-anchor="middle" class="note">GoalsView</text><text x="760" y="256" text-anchor="middle" class="note">LinksView</text><text x="760" y="286" text-anchor="middle" class="note">CSS responsive</text>
  <path d="M250 235H340" class="line"/><path d="M560 235H650" class="line"/>
  <rect x="60" y="430" width="190" height="120" rx="16" class="ready"/><text x="155" y="468" text-anchor="middle" class="label">Quotable API</text><text x="155" y="496" text-anchor="middle" class="note">fetch random quote</text><text x="155" y="520" text-anchor="middle" class="note">AbortController</text>
  <rect x="340" y="410" width="220" height="160" rx="16" class="ready"/><text x="450" y="450" text-anchor="middle" class="label">Normalizacion</text><text x="450" y="478" text-anchor="middle" class="note">{content, author}</text><text x="450" y="506" text-anchor="middle" class="note">catch -> fallback</text><text x="450" y="534" text-anchor="middle" class="note">timeout 1.5 s: pendiente</text>
  <path d="M250 490H340" class="line"/><path d="M450 410V330" class="line"/>
  <rect x="650" y="410" width="220" height="160" rx="16" class="planned"/><text x="760" y="450" text-anchor="middle" class="label">Futuras fuentes</text><text x="760" y="478" text-anchor="middle" class="note">n8n -> Pi 5</text><text x="760" y="506" text-anchor="middle" class="note">healthchecks</text><text x="760" y="534" text-anchor="middle" class="note">Grafana / persistencia</text>
  <path d="M560 490H650" class="line future"/>
  <text x="940" y="455" class="note">PENDIENTE</text><text x="940" y="480" class="note">adaptadores tipados</text><text x="940" y="502" class="note">estados offline</text><text x="940" y="524" class="note">store local</text>
</svg>
